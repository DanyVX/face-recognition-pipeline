[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "face-recognition-pipeline"
dynamic = ["version"]
description = "Benchmarked face recognition pipeline: detect, align, embed, index, verify, identify."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.2",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.142.2",
    "numpy>=2.4.6",
    "onnxruntime>=1.30.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "prometheus-client>=0.26.0",
    "psutil>=5.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.32",
    "typer>=0.12",
    "uvicorn>=0.54.0",
]

[project.scripts]
frp = "frp.cli:app"

[dependency-groups]
bench = [
    "matplotlib>=3.11.2",
    "onnx>=1.23.1",
    "onnxconverter-common>=1.16.0",
]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-psutil>=5.9",
]

[tool.hatch.version]
path = "src/frp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/frp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "bench"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PTH", "RUF", "S", "SIM", "UP", "W"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"bench/report.py" = ["E501"]  # long prose strings in the markdown templates

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts", "bench"]

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*", "onnxconverter_common", "onnxconverter_common.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not slow and not gpu'"
filterwarnings = ["error"]
markers = [
    "slow: slow tests, skipped by default (run with -m slow)",
    "gpu: tests that need a GPU, skipped by default (run with -m gpu)",
]

[tool.coverage.run]
source = ["frp"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.uv]
link-mode = "copy"
default-groups = ["dev", "bench"]
